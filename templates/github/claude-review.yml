# Shared Claude PR reviewer — copy to .github/workflows/claude-review.yml in a
# project to adopt it (methodology ADR 0021; runs on the Agent SDK, ADR 0026).
#
# Prerequisites:
#   1. Add an ANTHROPIC_API_KEY secret to THIS repo:
#        gh secret set ANTHROPIC_API_KEY -R <owner>/<repo>
#      Billing: reviews run on the Claude Agent SDK, so a key from an org that
#      receives a Max plan's monthly promotional API credit spends that credit;
#      any other key is billed as ordinary API usage. Check the Console's
#      Billing page, not its usage analytics (which label SDK runs Claude Code).
#   2. Allow the methodology repo's reusable workflows to be called from your
#      repos (one-time): Settings -> Actions -> General -> Access, or:
#        gh api -X PUT /repos/<owner>/methodology/actions/permissions/access \
#          -f access_level=user
#      NOTE: this only works within ONE account. A repo owned by a different
#      org/user cannot call this reusable workflow — give that repo a
#      standalone copy instead (nurturepa/cif's claude-code-review.yml and
#      scripts/ci/claude-review.py are one), keeping its pinned model and its
#      fail-red handling.
#
# No Claude GitHub App and no OIDC token permission are needed: the review is
# posted by github-actions[bot] with this job's GITHUB_TOKEN.
#
# What a green check means: the review ran on the commits it saw. It runs on
# opened/ready_for_review only, so later pushes are not reviewed (add
# `synchronize` to `types` if you want every push reviewed, at more cost).
# Any failure to review is a red check, never a silent green.
#
# Advisory only — keep your deterministic CI (lint/type/test) as the required
# merge gate.
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: vpciii/methodology/.github/workflows/claude-review.yml@main
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
    # Optional overrides (defaults shown). If you pin the `uses:` line to a
    # tag, set reviewer_ref to the same tag.
    # with:
    #   model: "claude-opus-5[1m]"
    #   max_turns: 40
    #   max_budget_usd: 3.00
    #   project_docs: "CLAUDE.md AGENTS.md CONTRIBUTING.md docs/glossary.md docs/conventions.md docs/architecture.md"
    #   reviewer_ref: main

name: Claude PR review (reusable)

# Shared, methodology-aware PR reviewer (ADR 0021), driven by the Claude
# Agent SDK (ADR 0026, specs/claude-review-agent-sdk/). Projects adopt it
# with a thin caller workflow — see templates/github/claude-review.yml.
#
# Advisory only: it posts one review comment. Each project's deterministic
# CI (lint, format, strict type-check, tests, spec coverage) stays the
# required merge gate — this never blocks a merge.
#
# Why the SDK and not the Claude Code GitHub Action (used until ADR 0026):
# the Console bills the action as Claude Code, which the Max plan's monthly
# promotional API credit does not cover; it does cover the Agent SDK.
#
# Shape: .github/claude-review/claude_review.py (checked out from this repo
# at `reviewer_ref`) runs a read-only agent over the caller's checkout and
# writes the review to a file; a separate step posts it. The agent never
# holds a GitHub token (R-4). Any failure — an error, a cap hit, an empty
# review, an unexpected tool list or context window — fails the job red,
# never a green check with nothing reviewed (R-5).
#
# A green check means the review RAN, on the commits it saw: callers trigger
# on opened/ready_for_review, so later pushes go unreviewed. Fork PRs get no
# secrets, so the script refuses to run and the check goes red on them.

on:
  workflow_call:
    inputs:
      model:
        description: >-
          Review model. Pinned rather than inherited from the SDK, so a
          change in review model is a reviewable diff here (R-7). A "[1m]"
          suffix selects the 1M-token window, and the run fails if a
          smaller one is reported (R-13). Override per repo, e.g.
          "claude-sonnet-5-5".
        type: string
        required: false
        default: "claude-opus-5[1m]"
      max_turns:
        description: "Turn cap for one review (R-6)."
        type: number
        required: false
        default: 40
      max_budget_usd:
        description: "Spend cap in USD for one review (R-6)."
        type: number
        required: false
        default: 3.00
      project_docs:
        description: >-
          Space-separated governing docs, relative to the repo root, put in
          the prompt in full (R-11). Missing ones are skipped; the run fails
          if none exists. The agent can still read anything else.
        type: string
        required: false
        default: "CLAUDE.md AGENTS.md CONTRIBUTING.md docs/glossary.md docs/conventions.md docs/architecture.md"
      reviewer_ref:
        description: >-
          Ref of vpciii/methodology to take the review script from. Keep it
          in step with the @ref in your `uses:` line if you pin one.
        type: string
        required: false
        default: "main"
    secrets:
      anthropic_api_key:
        description: "Anthropic API key, supplied by the calling repo."
        required: true

jobs:
  review:
    # Skip drafts and explicit opt-outs to hold down cost and noise.
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.title, '[skip-review]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the repo under review
        uses: actions/checkout@v7
        with:
          path: pr
          # The pull_request merge commit and its base parent, so the script
          # can diff HEAD^1..HEAD without a token.
          fetch-depth: 2
          # actions/checkout is handed the job token by default (its `token`
          # input), here and in the next step. Keep it out of .git/config,
          # where the agent's Read tool could otherwise reach it: with this
          # off, the token is used for the fetch and never written to disk.
          persist-credentials: false

      - name: Checkout the reviewer
        uses: actions/checkout@v7
        with:
          repository: vpciii/methodology
          ref: ${{ inputs.reviewer_ref }}
          path: reviewer
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the Agent SDK
        # Pinned exactly (R-9). Each SDK release bundles a fixed Claude Code
        # CLI (0.2.179 → CLI 2.1.319), so this pins the CLI too.
        run: python -m pip install --disable-pip-version-check claude-agent-sdk==0.2.179

      - name: Run Claude review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic_api_key }}
          MODEL: ${{ inputs.model }}
          MAX_TURNS: ${{ inputs.max_turns }}
          MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
          PROJECT_DOCS: ${{ inputs.project_docs }}
        run: >-
          python reviewer/.github/claude-review/claude_review.py
          --repo pr
          --model "$MODEL"
          --max-turns "$MAX_TURNS"
          --max-budget-usd "$MAX_BUDGET_USD"
          --docs "$PROJECT_DOCS"
          --event "$GITHUB_EVENT_PATH"
          --out "$RUNNER_TEMP/review.md"

      - name: Post review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/review.md"

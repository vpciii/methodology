name: Claude PR review (reusable)

# Shared, methodology-aware PR reviewer (global ADR 0021). Projects adopt it
# with a thin caller workflow — see templates/github/claude-review.yml.
#
# Advisory only: it posts review comments. Each project's deterministic CI
# (lint, format, strict type-check, tests, spec coverage) stays the required
# merge gate — this never blocks a merge.
#
# A green check means the review RAN, not that the PR is clean — and only for
# the commits it saw. Callers trigger on opened/ready_for_review (a cost/noise
# trade-off), so later pushes go unreviewed and the stale check drops out of
# the rollup rather than showing as outdated. The one silent-green path the
# action itself has is turned red below. (Found in practice in nurturepa/cif.)
#
# That skip is the action's guard against a PR rewriting the review prompt to
# exfiltrate the API key. It compares the ENTRY workflow (the caller the
# pull_request event triggered) with the default branch's copy — so it covers
# a project's caller, but not this reusable workflow when a caller in the same
# repo references it by local path (this repo's pr-review.yml): a branch here
# that edits this file still gets a run with the secret.

on:
  workflow_call:
    inputs:
      model:
        description: >-
          Review model. Pinned rather than inherited from the action, so a
          change in review model is a reviewable diff here, not a silent
          shift in review quality. Override per repo, e.g.
          "claude-sonnet-5-5".
        type: string
        required: false
        default: "claude-opus-5[1m]"
      claude_args:
        description: >-
          Extra args for the Claude CLI, appended after --model (so passing
          them never unpins the model).
        type: string
        required: false
        default: ""
    secrets:
      anthropic_api_key:
        description: "Anthropic API key, supplied by the calling repo."
        required: true

jobs:
  review:
    # Skip drafts and explicit opt-outs to hold down cost and noise.
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.title, '[skip-review]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          track_progress: true
          # Quote the model: claude_args is tokenized with shell-quote, which
          # would otherwise read "[1m]" as a glob.
          claude_args: --model "${{ inputs.model }}" ${{ inputs.claude_args }}
          prompt: |
            Review this pull request against THIS project's own standards, not
            generic best practices. Read whichever of the repo's governing
            artifacts exist — CLAUDE.md, ADRs (docs/adr/ or adr/), the glossary,
            methodology.md, CONTRIBUTING.md, and any specs/<feature>/ files this
            PR touches — and judge the change against them and the project's
            Definition of Done.

            Flag, with file and line, anything that is:
            - Incorrect — real bugs, broken edge cases, idempotency /
              state-machine / concurrency errors, security problems, or
              committed secrets.
            - Off-contract — behavior that doesn't match the relevant spec's
              success criteria; new behavior without a test, or a bug fix
              without a regression test; an accepted ADR contradicted; a
              domain term used against the glossary.
            - Process drift — docs not updated in the same PR as the behavior
              they describe, or commits that don't follow Conventional Commits.

            Prefer a few high-confidence, actionable findings over a pile of
            nitpicks. Do not repeat what CI already enforces (lint, format,
            strict type-check, and tests run as a separate required check).
            If the PR is clean, say so in a sentence or two.

      # Turn the silent skip into a red check. The action exits 0 when
      # Anthropic's OIDC exchange declines to mint a GitHub App token because
      # the executing workflow file differs from the default branch's copy
      # (see the header) — so the job went green having reviewed nothing.
      #
      # `conclusion` is set only after Claude has run; the validation skip
      # returns before that, leaving it empty. The action's other empty-and-
      # green path (no trigger found) is unreachable in either mode, because
      # `prompt` above is always supplied (track_progress puts pull_request
      # events in tag mode, whose trigger check returns true when a prompt
      # is set). A thrown error already fails the job, so this step is
      # deliberately not `always()`. Re-verify this against the action's
      # early-return set when bumping anthropics/claude-code-action past v1.
      - name: Fail if the review never ran
        if: steps.review.outputs.conclusion == ''
        run: |
          echo "::error::Claude review did not run (workflow validation skip) — this PR was NOT reviewed"
          exit 1

# Deterministic checks for the methodology repo itself (ADR 0026, R-14).
# The shared reviewer's tests run here, so a change that breaks the reviewer
# fails this check before the broken reviewer is called by anyone; the spec
# coverage check holds this repo's own specs to methodology §5.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Shared reviewer tests
        run: python .github/claude-review/test_claude_review.py

      - name: Spec coverage
        run: python templates/ci/check-spec-coverage.py
